services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - GOOGLE_FACTCHECK_API_KEY=${GOOGLE_FACTCHECK_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
